# ProvPilot aircraft definition — McDonnell Douglas MD-81
# ------------------------------------------------------
# A variant of the MD-82 (aircraft/md80, FlightGear MD-80 by Josh Davidson,
# GPL-2.0): the same airframe, cockpit, systems and sounds with JT8D-217
# engines and their thrust limits, its own livery folder and N1 / N2 gauge
# faces. Everything not set here comes from md80/aircraft.cfg ([aircraft]
# base) and files this folder lacks are read from md80/ (docs/AIRCRAFT_CONFIG.md).

[aircraft]
    id          "md81"
    base        "md80"
    name        "McDonnell Douglas MD-81"
    description "Twin-jet airliner. 2x Pratt & Whitney JT8D-217, 140 000 lb MTOW."

[jsbsim]
    # jsbsim/aircraft/md81/md81.xml (FlightGear FDE/MD-81.xml): engines and
    # systems come from md80/jsbsim.
    model "md81"

[liveries]
    # scripts/fg_liveries.py: the MD-81 liveries of the package and the
    # -set file's gauge faces (n1-217 / n2-217), textures under md80/model/liveries
    catalog "model/liveries/MD-81.json"

# The HT9100 IDENT page of this variant (md80/aircraft.cfg [mcdu]).
[mcdu]
    ht9100  true
    type    "DC-9-81"
    engines "JT8D-217"
