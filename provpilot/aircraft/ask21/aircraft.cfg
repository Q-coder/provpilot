# ProvPilot aircraft definition: Schleicher ASK 21 (FlightGear ASK21, GPL-2)
# ------------------------------------------------------------------------
# Source package: FlightGear "ASK21" (Heiko Schulz, Thomas Polzer, Viktor
# Radnai, Benedikt Wolf, Gilberto Agostinho and others — see
# jsbsim/aircraft/ask21/AUTHORS.md). The JSBSim variant (ask21-jsb) is the
# flight model; the 3D model and its instruments are built by
# scripts/fg_a10_build.py from the package (docs/ASK21_PORT.md).

[aircraft]
    id          "ask21"
    name        "Schleicher ASK 21"
    description "Two-seat training glider. No winch or tow yet: set the start height and speed in Settings > Aircraft."

[jsbsim]
    # <aircraft_dir>/jsbsim/aircraft/ask21/ask21.xml (FlightGear ask21-jsb.xml
    # with Systems/ask21-aero.xml alongside). No engine, no FlightGear-side
    # properties: the FDM is self-contained.
    model "ask21"
    # FlightGear-side properties the FCS (ground handling) references; they
    # must exist or the FDM refuses to load. Set once, nothing drives them.
    init_properties "jsbsim/init_properties.json"

[model]
    # Canopy glass (AircraftRig::apply_glass_materials): the AC3D GLASS / transparent
    # materials came out milky grey; a dark tint at low alpha with a tight highlight.
    glass_materials "GLASS, transparent*, Material.014"
    glass_tint      0.3 0.36 0.42
    glass_alpha     0.14
    glass_roughness 0.06
    file        "model/ask21_fg.glb"
    res_file    "res://aircraft/ask21/model/ask21_fg.glb"
    root_node   "AC/Node3D2/C172P_1"
    # FlightGear model frame (x aft) -> AC frame, as the A-10 and MD-80.
    rotation_deg "0, 90, 0"
    scale        5.0
    # Wheels on the ground: tests/probe_gear_height.tscn.
    offset       "0, 2.84, 0"
    flip_normals        false
    flip_normals_prefix ""
    fg_animations "model/animations.json"

[camera]
    # front seat eye point (set from the panel position, probe below)
    # Front seat: 2.65 m ahead of the model origin, 1.02 m up (the FDM's
    # EYEPOINT), 0.65 m behind the panel. AC units are 10 per model metre:
    # x = 10 z_fg (right), y = 10 z_fg (up) + 4.8, z = -10 x_fg + 0.9.
    cockpit_position "0.0, 15.0, 27.4"
    cockpit_rotation_deg "-6, 0, 0"
    cockpit_fov      75.0
    # external camera: metres from the aircraft (a 17 m span glider)
    orbit_distance     25.0
    orbit_distance_min 5.0
    orbit_distance_max 200.0

[animation]
    # The model's elevator and rudder rotate by surface-positions/*-pos-norm x 6
    # deg; YASim scaled those outputs to +-4 for full travel, i.e. 24 deg on
    # the model. The JSBSim variant's full travel is 20 deg elevator and
    # 57 deg rudder (its FCS clips at 1 rad): degrees x these = +-4.
    elevator_pos_norm_per_deg 0.2
    rudder_pos_norm_per_deg   0.07

[levers]

[control_limits]
    aileron_max_deg     20.0
    elevator_max_deg    25.0
    rudder_max_deg      30.0
    flap_max_deg        0.0
    front_wheel_max_deg 0.0

[gear]
    retractable false

[sound]
    fg_sounds  "sounds/sounds.json"

# The glider's panel is metric (km/h, m, m/s): so are the HUD readouts.
[instruments]
    units "metric"

# Throttle keys, gamepad triggers and axis work the airbrake lever (full =
# in, idle = out); Settings > Aircraft > Controls overrides this per aircraft.
[controls]
    throttle_drives "airbrakes"

# Airborne start (Settings > Aircraft overrides these per aircraft): a glider
# without a winch or tow begins level and trimmed over the chosen airport.
[start]
    agl_ft   3000
    speed_kt 55

[performance]
    vne_kts         151
    vno_kts         108
    vs_kts          35
    vs0_kts         35
    vr_kts          0
    vref_kts        50
    ceiling_ft      30000
    max_takeoff_lbs 1323
    empty_lbs       794
    notes "Vne 280 km/h (151 kt), rough air 200 km/h (108 kt), stall about 65 km/h (35 kt) two up, best glide 1:34 at 95 km/h (51 kt), minimum sink 0.65 m/s at 80 km/h. Approach 90-100 km/h with the airbrakes. The FDM carries pilot and copilot of 80 kg each and no fuel."
