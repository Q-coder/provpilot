# ProvPilot aircraft definition — McDonnell Douglas MD-87
# ------------------------------------------------------
# A variant of the MD-82 (aircraft/md80, FlightGear MD-80 by Josh Davidson,
# GPL-2.0) with the short fuselage: its own airframe mesh and model
# (Models/MD-87.xml -> model/md87_fg.glb, cockpit 2.9 m further aft of the
# model origin), JT8D-217C engines (the -217A files), MD-87 mass, gear and
# external-reaction files, the stabilizer arm factor, its liveries and a
# combined standby instrument. Everything not set here comes from
# md80/aircraft.cfg ([aircraft] base) and files this folder lacks (sounds,
# Nasal shims, init list, engines, systems) are read from md80/.

[aircraft]
    id          "md87"
    base        "md80"
    name        "McDonnell Douglas MD-87"
    description "Short-fuselage MD-80. 2x Pratt & Whitney JT8D-217C, 140 000 lb MTOW."

[jsbsim]
    # jsbsim/aircraft/md87/md87.xml (FlightGear FDE/MD-87.xml) with its
    # Systems/md-87-cockpit-firetank; engines and the other systems from md80/jsbsim.
    model "md87"
    # the base list plus the MD-87-set.xml stab arm factor (aero/arm-factor 0.97)
    init_properties "jsbsim/init_properties.json, jsbsim/init_md87.json"

[model]
    # scripts/fg_a10_build.py --prefix Aircraft/MD-80/ --root Models/MD-87.xml
    # --glb-name md87_fg.glb (skips as the MD-82 plus Effects/Firetank and
    # Models/firetank.xml) --set-xml aircraft/MD-80/MD-87-set.xml
    file          "model/md87_fg.glb"
    res_file      "res://aircraft/md87/model/md87_fg.glb"
    fg_animations "model/animations.json"

# FlightGear view 0 of the MD-87 set file: z -16.68 (the MD-82's -19.58 less
# the cockpit's 2.9 m offset in MD-87-main.xml), in AC units of 0.1 m.
[camera]
    cockpit_position "5.0, 24.5, 166.8"

[lights]
    # MD-87-main.xml placements: wing lights as the MD-82 (5.40 m), the nose
    # light on the MD-87's nose gear (5.36 m in the airframe file, -22.62 m offset).
    landing_pos "5.40, -0.23, 16.17,  -17.26, -1.32, -0.14,  5.40, -0.23, -16.17"
    # cockpit floods 2.9 m aft of the MD-82's
    flood_pos   "-17.1, 1.45, 0.6,  -17.1, 1.45, -0.6,  -16.6, 1.25, 0.0,  -16.7, 1.75, 0.0"

[liveries]
    catalog "model/liveries/MD-87.json"

# The HT9100 IDENT page of this variant (md80/aircraft.cfg [mcdu]).
[mcdu]
    ht9100  true
    type    "DC-9-87"
    engines "JT8D-217C"
