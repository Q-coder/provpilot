# ProvPilot aircraft definition — Fairchild Republic A-10A Thunderbolt II
# ----------------------------------------------------------------------
# Ported from the FlightGear "A-10" aircraft (github.com/l0k1/A-10, GPL-2.0).
# ProvPilot only consumes JSBSim + a glTF model, so of the FlightGear package
# we reuse ONLY:
#   * the JSBSim flight model (A10JSBsim.xml + Engines/ + Systems/), which is a
#     self-contained twin-TF34 turbofan FDM — NOT the primary YASim model, which
#     ProvPilot cannot run.
#   * the AC3D airframe (Models/A10-004-015l3.ac), converted to model/a10.glb
#     with assimp (+ scripts/pack_glb.py to embed textures).
# FlightGear's Nasal systems, XML animations, HUD, liveries and weapons do not
# transfer and are not used here.
#
# See aircraft/c172p/aircraft.cfg for the full format documentation.

[aircraft]
    id          "a10"
    name        "Fairchild A-10A Thunderbolt II"
    description "Twin-engine close air support jet. 2× GE TF34 turbofans."

[jsbsim]
    # JSBSim model name; data lives under <aircraft_dir>/jsbsim/{aircraft,engine,systems}.
    # The folder <aircraft_dir>/jsbsim/aircraft/a10/a10.xml must exist.
    model "a10"

[model]
    # Built from the FlightGear package by scripts/fg_a10_build.py
    # (docs/A10_FLIGHTGEAR_PORT.md): airframe + full virtual cockpit, true
    # metres, glTF frame x aft / y up / z left. Yaw the nose round to the
    # AC frame's +Z (nose) / +X (left).
    file        "model/a10_fg.glb"
    res_file    "res://aircraft/a10/model/a10_fg.glb"
    root_node   "AC/Node3D2/C172P_1"
    rotation_deg "0, 90, 0"
    # The AC frame draws models at 0.2 m per unit (AC node 0.1 x Node3D2 2):
    # 5.0 puts the 17.5 m jet at real size (decision 2026-09-21).
    scale        5.0
    # Wheels on the ground: measured with tests/probe_gear_height.tscn
    # (parked, FDM on the ground); one unit here moves the model 0.2 m in
    # the world (the loader frame is not scaled by [model] scale). Re-measure after any change to the FDM gear geometry.
    offset       "0, 10.5, 0"
    flip_normals        false
    flip_normals_prefix ""
    # FlightGear animation manifest (scripts/fg_a10_build.py): every
    # animation of the model XML, run by FGAnimator with FGBridge values.
    fg_animations "model/animations.json"
    # FlightGear draws these displays with Canvas at runtime; the meshes carry
    # hand-drawn placeholder textures (HUD combiner, MPCD, CMSC, CMSP).
    hide_nodes "A-10-detail-cpt__hud-screen, mpcd__canvas_disp, A-10-central-up-warning__cmsc_canvas, cockpit__CMSP_CANVAS_DISPLAY"

# Cockpit camera: the FlightGear pilot eye point (3.20 m aft of the nose
# datum, 1.50 m up) in AC units (0.1 m), plus the [model] offset (10.5 units
# x 0.2 m = 2.1 m up): y = 15 + 21.
[camera]
    cockpit_position "0.0, 36.0, -32.0"
    cockpit_fov      65.0
    # external camera: metres from the aircraft (a 17.5 m jet)
    orbit_distance     32.0
    orbit_distance_min 6.0
    orbit_distance_max 300.0

# No control-surface / gear meshes are wired yet: the airframe flies with static
# surfaces (as the PC-7 did initially). The converted glb DOES keep the AC3D
# object hierarchy (elevators, ailerons, rudders, gear, canopy are separate
# nodes), so these can be mapped later exactly like the PC-7 workflow.
[animation]

[levers]

[control_limits]
    aileron_max_deg     20.0
    elevator_max_deg    25.0
    rudder_max_deg      25.0
    flap_max_deg        20.0
    front_wheel_max_deg 25.0

# Flap detents. positions = JSBSim flap-cmd-norm values; names = HUD labels.
[flaps]
    positions "0.0, 0.5, 1.0"
    names     "UP, MVR, DN"

# No [propeller] section — the A-10 is a pure turbofan jet.

# Landing gear: retractable tricycle gear. The gear kinematics (doors,
# jacks, braces, oleo compression, wheel spin) come from the FlightGear
# animations driven by JSBSim's gear/unit[n]/pos-norm; no baked clip.
[gear]
    retractable     true
    retract_seconds 4.0
    # Nose-wheel steering. The FDM's <max_steer> (5 deg) is the LIMITED range
    # used with the pedals at speed; Ctrl+W engages FULL nose-wheel steering
    # (the real A-10's NWS button on the stick), 60 deg either side for
    # taxiing. steer_limited_deg must equal <max_steer> in the JSBSim XML.
    steer_limited_deg 5.0
    steer_full_deg    60.0

# Exterior lights (src/aircraft_lights.cpp). Each key lists model mesh nodes; the
# light sprite sits at the mesh's bounding-box centre and follows the node
# (the landing and taxi lights ride on the nose gear and retract with it).
# The FlightGear model keeps its lenses: L/R-NavLight at the wingtips (red /
# green), the three white strobes (wingtips + tail), TopLightLens = the red
# anti-collision beacon on the spine, and the two nose-strut lights as
# "-on" / "-off" mesh pairs, which ProvPilot swaps with the switch (L key).
[lights]
    nav_left   "L-NavLight"
    nav_right  "R-NavLight"
    strobe     "L-StrobeLight-off, R-StrobeLight-off, Aft-StrobeLight-off"
    beacon     "TopLightLens"
    landing    "UC-NoseStrutTop-light-on"
    taxi       "UC-NoseStrutSteerRing-light-on"
    # The lens meshes ride on the nose gear through the FlightGear gear
    # animation, and their lit/unlit pairs are switched by the FlightGear
    # select animations (FGBridge feeds systems/electrical/outputs/*-light).
    pair_meshes false
    landing_pitch_deg 5.0
    landing_range_m   300.0
    taxi_range_m      90.0

[sound]
    # FlightGear sound set (scripts/fg_a10_sounds.py -> sounds/sounds.json +
    # .wav): engines, wind, canopy, switches, stall warning, played by
    # src/fg_sounds.cpp from the bridge's property values. The basic engine loop
    # below is kept for aircraft without a set and stays silent here.
    fg_sounds  "sounds/sounds.json"
    engine     "res://sounds/c172_engine_inflight.ogg"
    pitch_min  0.7
    pitch_max  1.6
    vol_db_min -12.0
    vol_db_max 3.0

# Reference figures (public data for the A-10A; not tuned to the FDM), shown
# in Settings > Aircraft.
[performance]
    vne_kts         450
    vno_kts         300
    vs_kts          120
    vs0_kts         105
    vr_kts          135
    vref_kts        140
    ceiling_ft      45000
    max_takeoff_lbs 51000
    empty_lbs       24959
    notes "Vne 450 KIAS / M 0.75. Take-off and approach speeds vary with weight; 135 / 140 kt suit a mid-weight jet. The FDM carries three internal tanks of 3450 lb."
