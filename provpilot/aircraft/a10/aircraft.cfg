# ProvPilot aircraft definition — Fairchild Republic A-10A Thunderbolt II
# ----------------------------------------------------------------------
# Ported from the FlightGear "A-10" aircraft (github.com/l0k1/A-10, GPL-2.0).
# ProvPilot only consumes JSBSim + a glTF model, so of the FlightGear package
# we reuse ONLY:
#   * the JSBSim flight model (A10JSBsim.xml + Engines/ + Systems/), which is a
#     self-contained twin-TF34 turbofan FDM — NOT the primary YASim model, which
#     ProvPilot cannot run.
#   * the AC3D airframe (Models/A10-004-015l3.ac), converted to model/a10.glb
#     with assimp (+ scripts/pack_glb.py to embed textures).
# FlightGear's Nasal systems, XML animations, HUD, liveries and weapons do not
# transfer and are not used here.
#
# See aircraft/c172p/aircraft.cfg for the full format documentation.

[aircraft]
    id          "a10"
    name        "Fairchild A-10A Thunderbolt II"
    description "Twin-engine close air support jet. 2× GE TF34 turbofans."

[jsbsim]
    # JSBSim model name; data lives under <aircraft_dir>/jsbsim/{aircraft,engine,systems}.
    # The folder <aircraft_dir>/jsbsim/aircraft/a10/a10.xml must exist.
    model "a10"

[model]
    # 3D model file, relative to the aircraft directory.
    file        "model/a10.glb"
    # res:// fallback used in exported builds / editor when no on-disk .glb exists.
    res_file    "res://aircraft/a10/model/a10.glb"
    # Scene-tree path (from node_3d root) to the loader node the model parents
    # under. Same loader node as the Cessna/PC-7 — the model is swapped at runtime.
    root_node   "AC/Node3D2/C172P_1"
    # This model is now a DIRECT Blender glTF export (not the assimp/.ac path):
    # it carries the gear-retract animation clip, vertex normals, embedded textures
    # and double-sided materials. Orientation: length ~along local +X, up +Y; yaw
    # the nose round to Godot's -Z forward. offset lifts the deployed (gear-down)
    # wheels to the ground. ⚠️ These rotation/offset values are STARTING GUESSES —
    # headless measurement was unreliable for this animated glb, so verify live in
    # the editor (cfg is read res-first): if the jet is mis-oriented adjust
    # rotation_deg; if it floats/sinks adjust offset; if lit-from-below set
    # flip_normals true.
    rotation_deg "0, 90, 0"
    offset       "0, 2.21, 0"
    # Blender's glTF exporter writes outward normals, so no flip is needed.
    # Materials are double-sided so any reverse-wound faces still show.
    flip_normals        false
    flip_normals_prefix ""

# Cockpit camera. Omit to keep the scene default; seeded with a rough forward
# eyepoint (JSBSim EYEPOINT ≈ 128 in fwd of datum, 38 in up). Tune live.
[camera]
    cockpit_position "0.0, 1.2, 1.0"
    cockpit_fov      55.0

# No control-surface / gear meshes are wired yet: the airframe flies with static
# surfaces (as the PC-7 did initially). The converted glb DOES keep the AC3D
# object hierarchy (elevators, ailerons, rudders, gear, canopy are separate
# nodes), so these can be mapped later exactly like the PC-7 workflow.
[animation]

[levers]

[control_limits]
    aileron_max_deg     20.0
    elevator_max_deg    25.0
    rudder_max_deg      25.0
    flap_max_deg        20.0
    front_wheel_max_deg 25.0

# Flap detents. positions = JSBSim flap-cmd-norm values; names = HUD labels.
[flaps]
    positions "0.0, 0.5, 1.0"
    names     "UP, MVR, DN"

# No [propeller] section — the A-10 is a pure turbofan jet.

# Landing gear: retractable tricycle gear driven by an IMPORTED animation clip
# (authored in Blender, all 37 per-part actions merged into one "gear_cycle" clip).
# The clip's first frame = gear DOWN (rest), last frame = gear UP, which is the
# convention ProvPilot's C++ gear animator seeks between. Press G to toggle; the
# JSBSim model drives drag + weight-on-wheels from gear/gear-pos-norm.
[gear]
    retractable     true
    retract_seconds 4.0
    animation       "gear_cycle"

[sound]
    # Placeholder: reuses the Cessna engine loop until a jet sample is added.
    engine     "res://sounds/c172_engine_inflight.ogg"
    pitch_min  0.7
    pitch_max  1.6
    vol_db_min -12.0
    vol_db_max 3.0
