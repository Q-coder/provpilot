# ProvPilot aircraft definition — McDonnell Douglas MD-83
# ------------------------------------------------------
# A variant of the MD-82 (aircraft/md80, FlightGear MD-80 by Josh Davidson,
# GPL-2.0): the same airframe, cockpit, systems and sounds with JT8D-219
# engines, their thrust limits and the forward / aft auxiliary fuel tanks,
# its own livery folder and N1 gauge faces. Everything not set here comes from
# md80/aircraft.cfg ([aircraft] base) and files this folder lacks are read
# from md80/ (docs/AIRCRAFT_CONFIG.md).

[aircraft]
    id          "md83"
    base        "md80"
    name        "McDonnell Douglas MD-83"
    description "Twin-jet airliner, longer range. 2x Pratt & Whitney JT8D-219, auxiliary tanks, 160 000 lb MTOW."

[jsbsim]
    # jsbsim/aircraft/md83/md83.xml (FlightGear FDE/MD-83.xml): engines and
    # systems come from md80/jsbsim.
    model "md83"

[liveries]
    catalog "model/liveries/MD-83.json"
