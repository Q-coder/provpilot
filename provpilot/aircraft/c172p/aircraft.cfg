# ProvPilot aircraft definition
# ------------------------------
# Describes everything ProvPilot needs to wire a 3D model + JSBSim flight
# model together at runtime, so the engine code stays aircraft-agnostic.
#
# Format:
#   [section]            section header
#   key "value"          string value (quoted; may contain spaces/slashes)
#   key value            bare value (numbers / true / false)
#   key "a, b, c"        comma-separated list (parsed by get_*_array)
#   # ...                comment (whole line or trailing)
#
# Parsed by aircraft_config.gd (class AircraftConfig).

[aircraft]
    id          "c172p"
    name        "Cessna 172P Skyhawk"
    description "Single-engine piston, 4-seat trainer. 160 HP."

[jsbsim]
    # JSBSim model name; data lives under <aircraft_dir>/jsbsim/{aircraft,engine,systems}.
    # The folder <aircraft_dir>/jsbsim/aircraft/<model>/<model>.xml must exist.
    model "c172p"

[model]
    # 3D model file, relative to the aircraft directory.
    file        "model/C172P_1.glb"
    # res:// fallback used in exported builds / editor when no on-disk .glb exists.
    res_file    "res://aircraft/c172p/model/C172P_1.glb"
    # Scene-tree path (from node_3d root) to the node the model is parented under.
    root_node   "AC/Node3D2/C172P_1"
    # Flip baked normals once at startup (.blend importer handedness fix).
    flip_normals true

# Cockpit camera (Camera1) placement, in AC-node-local meters. Tune live: in the
# editor these values are read straight from this file on relaunch.
#   cockpit_position     "x, y, z"  — camera origin (x=right, y=up, z=back)
#   cockpit_rotation_deg "p, y, r"  — optional extra pitch/yaw/roll vs the default
#   cockpit_fov          degrees    — optional field of view
# These seed values match the original scene Camera1 transform.
[camera]
    cockpit_position "0.342, 2.996, 0.948"
    cockpit_fov      50.0

# Control-surface mesh nodes to animate. Paths are relative to model.root_node.
[animation]
    rudder        "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_008/Cessna_Exterior_Body_MAT_0_008_Rudder"
    propeller     "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_001/Cessna_Exterior_Body_MAT_0_001_Body_MAT_0"
    left_aileron  "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_014/Cessna_Exterior_Body_MAT_0_014_Aileron_Left"
    right_aileron "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_015/Cessna_Exterior_Body_MAT_0_015_Aileron_Right"
    left_elevator "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_013/Cessna_Exterior_Body_MAT_0_013_Elevator_Left"
    right_elevator "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_012/Cessna_Exterior_Body_MAT_0_012_Elevator_Right"
    left_flap     "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_016/Cessna_Exterior_Body_MAT_0_016_Flaps_Left"
    right_flap    "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_017/Cessna_Exterior_Body_MAT_0_017_Flaps_Right"
    front_wheel   "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_021/Cessna_Exterior_Body_MAT_0_021_Body_Front"

# Interactive cockpit levers/switches, located via find_child by name under
# model.root_node. *_fallback is the original (unrenamed) Sketchfab node name.
[levers]
    mixture           "Dynamic_Switch_006_Mixture"
    mixture_fallback  "Dynamic_Switch_006"
    throttle          "Dynamic_Switch_005_Throttle"
    throttle_fallback "Dynamic_Switch_005"
    magneto           "Dynamic_Switch_003_Magnetos_Switch"
    magneto_fallback  "Dynamic_Switch_003"
    flap_lever        "Dynamic_Switch_007_Flaps_Leveler"
    flap_lever_fallback "Dynamic_Switch_007"

# Max visual deflection (degrees) for each animated control surface.
[control_limits]
    rudder_max_deg      16.0
    aileron_max_deg     20.0
    elevator_max_deg    25.0
    flap_max_deg        30.0
    front_wheel_max_deg 30.0

# Flap detents. positions = JSBSim flap-cmd-norm values; names = HUD labels.
[flaps]
    positions "0.0, 0.333, 0.667, 1.0"
    names     "UP, 10°, 20°, 30°"

[propeller]
    max_rpm         2700.0   # Reference max RPM
    blur_start_rpm  900.0    # RPM where blur disc appears (above idle)
    hide_blades_rpm 1200.0   # RPM where real blades are hidden
    disc_radius_m   0.95     # Blur disc radius (meters)

[sound]
    engine     "res://sounds/c172_engine_inflight.ogg"
    pitch_min  0.7    # at idle RPM
    pitch_max  1.6    # at max RPM
    vol_db_min -12.0  # at idle RPM
    vol_db_max 3.0    # at max RPM

