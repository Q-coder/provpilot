# ProvPilot aircraft definition
# ------------------------------
# Describes everything ProvPilot needs to wire a 3D model + JSBSim flight
# model together at runtime, so the engine code stays aircraft-agnostic.
#
# Format:
#   [section]            section header
#   key "value"          string value (quoted; may contain spaces/slashes)
#   key value            bare value (numbers / true / false)
#   key "a, b, c"        comma-separated list (parsed by get_*_array)
#   # ...                comment (whole line or trailing)
#
# Parsed by aircraft_config.gd (class AircraftConfig).

[aircraft]
    id          "c172p"
    name        "Cessna 172P Skyhawk"
    description "Single-engine piston, 4-seat trainer. 160 HP."

[jsbsim]
    # JSBSim model name; data lives under <aircraft_dir>/jsbsim/{aircraft,engine,systems}.
    # The folder <aircraft_dir>/jsbsim/aircraft/<model>/<model>.xml must exist.
    model "c172p"

[model]
    # 3D model file, relative to the aircraft directory.
    file        "model/C172P_1.glb"
    # res:// fallback used in exported builds / editor when no on-disk .glb exists.
    res_file    "res://aircraft/c172p/model/C172P_1.glb"
    # Scene-tree path (from node_3d root) to the node the model is parented under.
    root_node   "AC/Node3D2/C172P_1"
    # Flip baked normals once at startup (.blend importer handedness fix);
    # only the Sketchfab exterior (default prefix), not the FlightGear panel.
    flip_normals true
    # FlightGear generic instruments in the panel (model/panel.xml, built by
    # scripts/fg_panel_build.py with the Blender source C172P_1.blend).
    fg_animations "model/animations.json"
    # The Sketchfab glb is in metres (12.6 m span with the wingtip lenses), but
    # the AC frame draws models at 0.2 m per unit (AC node 0.1 x Node3D2 2):
    # 5.0 puts the aircraft at real size (2026-09-27; it was drawn at 1/5,
    # "a model plane" next to the Schmerlat kiosk).
    scale        5.0
    # Wheels on the ground: measured with tests/probe_gear_height.tscn (one
    # unit moves the model 0.2 m; the loader frame is not scaled by [model]
    # scale). Re-measure after any change to the FDM gear geometry.
    offset       "0, -0.64, 0"

# Cockpit camera (Camera1) placement, in AC-node-local meters. Tune live: in the
# editor these values are read straight from this file on relaunch.
#   cockpit_position     "x, y, z"  — camera origin (x=right, y=up, z=back)
#   cockpit_rotation_deg "p, y, r"  — optional extra pitch/yaw/roll vs the default
#   cockpit_fov          degrees    — optional field of view
# The eye point is the original scene Camera1 seat position, scaled x5 about
# the model origin with the model (2026-09-27).
[camera]
    cockpit_position "1.606, 17.200, 1.190"
    cockpit_fov      50.0
    # external camera: metres from the aircraft (an 11 m aeroplane)
    orbit_distance     20.0
    orbit_distance_min 4.0
    orbit_distance_max 200.0

# Control-surface mesh nodes to animate. Paths are relative to model.root_node.
[animation]
    rudder        "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_008/Cessna_Exterior_Body_MAT_0_008_Rudder"
    propeller     "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_001/Cessna_Exterior_Body_MAT_0_001_Body_MAT_0"
    left_aileron  "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_014/Cessna_Exterior_Body_MAT_0_014_Aileron_Left"
    right_aileron "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_015/Cessna_Exterior_Body_MAT_0_015_Aileron_Right"
    left_elevator "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_013/Cessna_Exterior_Body_MAT_0_013_Elevator_Left"
    right_elevator "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_012/Cessna_Exterior_Body_MAT_0_012_Elevator_Right"
    left_flap     "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_016/Cessna_Exterior_Body_MAT_0_016_Flaps_Left"
    right_flap    "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Cessna_Exterior_Body_MAT_0_017/Cessna_Exterior_Body_MAT_0_017_Flaps_Right"
    # NoseGear_Steer: pivot empty on the strut axis (fg_panel_build.py) that
    # carries the strut and the wheel; it yaws with the rudder.
    front_wheel   "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/NoseGear_Steer"
    # Spinner_Pivot: empty on the propeller axis (fg_panel_build.py) carrying
    # the spinner cone; always visible, spins with the blades.
    propeller_cone "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/Spinner_Pivot"

# Interactive cockpit levers/switches, located via find_child by name under
# model.root_node. *_fallback is the original (unrenamed) Sketchfab node name.
[levers]
    mixture           "Dynamic_Switch_006_Mixture"
    mixture_fallback  "Dynamic_Switch_006"
    throttle          "Dynamic_Switch_005_Throttle"
    throttle_fallback "Dynamic_Switch_005"
    magneto           "Dynamic_Switch_003_Magnetos_Switch"
    magneto_fallback  "Dynamic_Switch_003"
    flap_lever        "Dynamic_Switch_007_Flaps_Leveler"
    flap_lever_fallback "Dynamic_Switch_007"
    # OFF - R - L - BOTH - START turn clockwise; this model's key turns the
    # other way about its local Z, so the step is negative
    magneto_step_deg  -30.0
    # the key's rest pose in the model points at OFF (0); BOTH is 3 steps on
    magneto_rest_position 0

# Max visual deflection (degrees) for each animated control surface.
[control_limits]
    rudder_max_deg      16.0
    aileron_max_deg     20.0
    elevator_max_deg    25.0
    flap_max_deg        30.0
    # negative: the model's +X is the left wing, so a positive yaw about the
    # steering pivot would turn the wheel left
    front_wheel_max_deg -30.0

# Flap detents. positions = JSBSim flap-cmd-norm values; names = HUD labels.
[flaps]
    positions "0.0, 0.333, 0.667, 1.0"
    names     "UP, 10°, 20°, 30°"

[propeller]
    max_rpm         2700.0   # Reference max RPM
    blur_start_rpm  900.0    # RPM where blur disc appears (above idle)
    hide_blades_rpm 1200.0   # RPM where real blades are hidden
    disc_radius_m   0.95     # Blur disc radius (meters)
    cone_always_visible true # the spinner is its own part, not a swap-in mesh
    cone_spins          true # Spinner_Pivot sits on the axis

# Fixed gear with rolling tyres: fg_panel_build.py splits each tyre (with
# sidewalls and hub caps) out of the Sketchfab wheel object into a node whose
# origin is the axle, so it spins about its local X with the ground speed.
# The nose tyre hangs under the steering pivot.
[gear]
    retractable false
    legs        "nose, left, right"
    nose_wheel          "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/NoseGear_Steer/NoseWheel_Tyre"
    nose_retract_deg    0.0
    nose_roll           true
    nose_roll_axis      "x"
    nose_wheel_radius_m 0.20
    left_wheel          "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/MainWheel_L_Tyre"
    left_retract_deg    0.0
    left_roll           true
    left_roll_axis      "x"
    left_wheel_radius_m 0.24
    right_wheel          "Sketchfab_model/Cessna172_fbx/RootNode/75f3edaeef374a9f89e7b5ef606a0759_fbx/RootNode_001/Cessna-172/Cessna_Exterior/MainWheel_R_Tyre"
    right_retract_deg    0.0
    right_roll           true
    right_roll_axis      "x"
    right_wheel_radius_m 0.24

# Exterior lights (src/aircraft_lights.cpp): the Sketchfab wingtip and fin lenses,
# the tail lens added by fg_panel_build.py. +X is the left wing.
[lights]
    nav_left  "Cessna_Exterior_Body_MAT_0_025_Body_MAT_0"
    nav_right "Cessna_Exterior_Body_MAT_0_026_Body_MAT_0"
    nav_tail  "TailLight_lens"
    strobe    "Cessna_Exterior_Body_MAT_0_025_Body_MAT_0, Cessna_Exterior_Body_MAT_0_026_Body_MAT_0"
    beacon    "Cessna_Exterior_Body_MAT_0_009_Body_MAT_0"
    # no lens meshes yet: the C172's landing / taxi lights sit in the left
    # wing's leading edge; positions in model-root units = model metres
    # (x left, y up, z forward; the [model] scale sits on the loader node)
    landing_pos "2.6, 2.10, 0.55"
    taxi_pos    "2.6, 2.05, 0.55"

[sound]
    engine     "res://sounds/c172_engine_inflight.ogg"
    pitch_min  0.7    # at idle RPM
    pitch_max  1.6    # at max RPM
    vol_db_min -12.0  # at idle RPM
    vol_db_max 3.0    # at max RPM

# Reference figures (public data for the Cessna 172P; not tuned to the FDM),
# shown in Settings > Aircraft.
[performance]
    vne_kts         160
    vno_kts         129
    vs_kts          51
    vs0_kts         44
    vr_kts          55
    vref_kts        65
    ceiling_ft      13000
    max_takeoff_lbs 2400
    empty_lbs       1450
    notes "Vfe 85 kt. Best rate of climb 76 kt."
