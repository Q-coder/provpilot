# ProvPilot vehicle definition — SBB Re 4/4 locomotive (a rail vehicle)
# ---------------------------------------------------------------------------
# Listed in the welcome screen's "Vehicles" frame. For now Fly! only places
# it on the selected runway (kind "train" is not driven yet; the rails of the
# base tier are real geometry at true gauge, train motion comes later).
# Model: Sketchfab "Swiss Lok Re 4/4" by hotdoghans, CC-BY-4.0 (CREDITS.txt;
# the credit line must stay with any distribution), packed with
# scripts/glb_tool.py from the downloaded glTF.

[aircraft]
    id          "re44"
    name        "SBB Re 4/4 locomotive"
    description "Swiss electric locomotive (CC-BY-4.0, hotdoghans). Placed on the runway for now; no train motion yet."

[vehicle]
    kind        "train"
    wheelbase_m 10.0
    track_m     1.435
    clearance_m 0.0

[model]
    file        "model/re44.glb"
    res_file    "res://aircraft/re44/model/re44.glb"
    # glTF: length along X, y up, 9.6 m long in the file; the real Re 4/4 II
    # is 15.4 m, so 1.6 x the metre scale of 5.0. Wheels at y = 0.34 in the
    # file (0.54 m after scaling): offset in 0.2 m units.
    rotation_deg "0, -90, 0"
    scale        8.0
    offset       "0, -2.7, 0"
    flip_normals false

[camera]
    cockpit_position "0.0, 30.0, 60.0"
    cockpit_fov      70.0
    orbit_distance     30.0
    orbit_distance_min 6.0
    orbit_distance_max 200.0
