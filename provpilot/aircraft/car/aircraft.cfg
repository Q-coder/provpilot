# ProvPilot vehicle definition — Kenney Car Kit "sedan" (a ground vehicle, not an aircraft)
# ---------------------------------------------------------------------------
# Listed in the welcome screen's "Vehicles" frame. Fly! places it on the
# selected runway and src/drive_mode.cpp drives it (kinematic car on the
# drawn ground, JSBSim paused). Model: "sedan" from the Car Kit by Kenney
# (www.kenney.nl), CC0 (CREDITS.txt), packed with scripts/kenney_car_pack.py.

[aircraft]
    id          "car"
    name        "Low poly car"
    description "Small car for road testing. W / S drive, A / D steer, B handbrake (Settings > Keyboard, Vehicle)."

[vehicle]
    # kind "car" = driven by DriveMode; "train" = placed, not driven (yet)
    kind            "car"
    wheelbase_m     2.2
    track_m         1.0
    max_speed_kmh   120
    max_reverse_kmh 15
    accel_mps2      3.5
    brake_mps2      8.0
    max_steer_deg   32
    # node origin above the sampled ground (the model's wheels sit at y = 0)
    clearance_m     0.0

[model]
    file        "model/car.glb"
    res_file    "res://aircraft/car/model/car.glb"
    # glTF: nose +Z like the AC frame, y up, wheels on y = 0, 2.55 units
    # long. The AC frame draws models at 0.2 m per unit: 8.2 makes it a
    # 4.2 m car (the kit's cars are stubby: 2.5 m wide at that length).
    rotation_deg "0, 0, 0"
    scale        8.2
    offset       "0, 0, 0"
    flip_normals false

[camera]
    # The kit's cars are hollow shells without an interior: the "cockpit"
    # view is a bonnet camera, 0.3 m left of centre, 1.7 m up, 1 m ahead of
    # the model origin (AC-node units of 0.1 m). Checked with
    # tests/probe_vehicle_render.gd PROBE_VIEW=cpt (PROBE_EYE="x, y, z"
    # tries a point without editing this).
    cockpit_position "-3.0, 17.0, 10.0"
    cockpit_fov      75.0
    orbit_distance     9.0
    orbit_distance_min 3.0
    orbit_distance_max 80.0
