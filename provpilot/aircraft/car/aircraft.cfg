# ProvPilot vehicle definition — "Low poly car 6" (a ground vehicle, not an aircraft)
# ---------------------------------------------------------------------------
# Listed in the welcome screen's "Vehicles" frame. Fly! places it on the
# selected runway and src/drive_mode.cpp drives it (kinematic car on the
# drawn ground, JSBSim paused). Model: Sketchfab "Low poly car 6" by
# assetfactory, Sketchfab Standard licence (CREDITS.txt), packed with
# scripts/glb_tool.py from the downloaded glTF.

[aircraft]
    id          "car"
    name        "Low poly car"
    description "Small car for road testing. W / S drive, A / D steer, B handbrake (Settings > Keyboard, Vehicle)."

[vehicle]
    # kind "car" = driven by DriveMode; "train" = placed, not driven (yet)
    kind            "car"
    wheelbase_m     2.4
    track_m         1.3
    max_speed_kmh   120
    max_reverse_kmh 15
    accel_mps2      3.5
    brake_mps2      8.0
    max_steer_deg   32
    # node origin above the sampled ground (the model's wheels sit at y = 0)
    clearance_m     0.0

[model]
    file        "model/car.glb"
    res_file    "res://aircraft/car/model/car.glb"
    # glTF: length along +X (nose +X), y up, 3.14 m long. The AC frame's nose
    # is +Z: yaw -90. The AC frame draws models at 0.2 m per unit; 6.5 makes
    # it a 4.1 m car.
    rotation_deg "0, -90, 0"
    scale        6.5
    offset       "0, 0, 0"
    flip_normals false
    # the Sketchfab collision proxy box is not drawn
    hide_nodes   "Collider"

[camera]
    # driver's eye in AC-node units (0.1 m): 0.4 m left of centre (the cabin is
    # narrow: 0.5 m is already in the door), 1.05 m up over the dashboard, level
    # with the model origin. Checked with tests/probe_vehicle_render.gd
    # PROBE_VIEW=cpt (PROBE_EYE="x, y, z" tries a point without editing this).
    cockpit_position "-4.0, 10.5, 0.5"
    cockpit_fov      75.0
    orbit_distance     9.0
    orbit_distance_min 3.0
    orbit_distance_max 80.0
