# ProvPilot aircraft definition — McDonnell Douglas MD-82
# ------------------------------------------------------
# Ported from the FlightGear "MD-80" aircraft by Josh Davidson (Octal450),
# GPL-2.0 (docs/MD80_FLIGHTGEAR_PORT.md). The MD-80's systems (electrical,
# fuel, hydraulics, pneumatics, APU, flight controls, thrust limits, DFGS
# servos, instrumentation) are JSBSim <system> files, so the FDM carries the
# aircraft; the FlightGear-side property traffic the systems expect is
# provided by the bridge's property mirror. The Nasal of the package (cockpit
# glue, autoflight mode logic, canvas displays) is not run.
#
# See aircraft/c172p/aircraft.cfg for the full format documentation.

[aircraft]
    id          "md80"
    name        "McDonnell Douglas MD-82"
    description "Twin-jet airliner. 2x Pratt & Whitney JT8D-217A, 149 500 lb MTOW."

[jsbsim]
    # FDE max_steer: the model's gear/gear[0]/steering-norm is steer-pos-deg over this
    nose_steer_max_deg 82
    # <aircraft_dir>/jsbsim/aircraft/md80/md80.xml (FlightGear FDE/MD-82.xml
    # with its FDE/Config, Systems and Engines copied alongside).
    model "md80"
    # Two-way FlightGear property mirror (FGBridge): controls, instruments,
    # flight state and the engine interface go into the FDM, the systems'
    # outputs (instrumentation/*, systems/*, engines/*-actual) come back for
    # the model animations and sounds.
    fg_property_mirror true
    # Stabilizer trim a fresh session starts with (FlightGear: -0.24 = about 3 units nose-up)
    pitch_trim_default -0.24
    # Panel state at every flight start (engines running, after-start panel).
    init_properties "jsbsim/init_properties.json"
    # FlightGear property-rule files (the -set file's <autopilot><path> entries) run on
    # the bridge dictionary each frame (FGPropertyRules): the sound-control rules compute
    # the /sim/sound/* volumes and pitches the sound set reads from N1 / N2 / EPR, the
    # reversers, airspeed and the packs.
    # The DFGS control laws (Systems/dfgs-*.xml: the roll / pitch / yaw servo
    # commands the FCS mixes in while an autopilot is engaged, the flight
    # director bars, the autothrottle command the engines follow, the autotrim)
    # run after the autoflight module (docs/MD80_FLIGHTGEAR_PORT.md step 18).
    property_rules "sounds/sound-control.xml, jsbsim/rules/dfgs-drivers.xml, jsbsim/rules/dfgs-roll-yaw.xml, jsbsim/rules/dfgs-pitch.xml, jsbsim/rules/dfgs-thrust.xml"

[electrical]
    # The FDM's own electrical system powers the panel: the left DC bus.
    power_property "/systems/electrical/bus/dc-l"
    power_threshold 24.0

[liveries]
    # scripts/fg_liveries.py: the MD-82 liveries of the package and the
    # -set file's gauge faces (n1-217a / n2-217a), textures under model/liveries
    # (shared by the MD-81 / MD-83 / MD-87 variants, [aircraft] base "md80").
    catalog "model/liveries/MD-82.json"

[model]
    # Built from the FlightGear package by scripts/fg_a10_build.py --prefix
    # Aircraft/MD-80/ --root Models/MD-82.xml: airframe + cockpit + instruments,
    # true metres, glTF frame x aft / y up / z left. Yaw the nose round to the
    # AC frame's +Z (nose) / +X (left).
    file        "model/md80_fg.glb"
    res_file    "res://aircraft/md80/model/md80_fg.glb"
    root_node   "AC/Node3D2/C172P_1"
    rotation_deg "0, 90, 0"
    # The AC frame draws models at 0.2 m per unit: 5.0 puts the 45 m jet at real size.
    scale        5.0
    # Wheels on the ground: measured with tests/probe_gear_height.tscn (one unit = 0.2 m).
    offset       "0, 6.49, 0"
    flip_normals        false
    flip_normals_prefix ""
    fg_animations "model/animations.json"
    # The cockpit's Nasal bindings mapped to property actions (docs/MD80_FLIGHTGEAR_PORT.md D5).
    nasal_shims   "model/nasal_shims.json"
    # Text labels on the (hidden) canvas screens: the FMA's mode windows.
    screen_texts  "model/screen_texts.json"
    # The flood knobs are plain rotate animations in FlightGear (no binding, the
    # effect is renderer side): give them a property-adjust action, 0.05 per click.
    knob_actions  "controls/lighting/capt-flood:0.05:0:1, controls/lighting/fo-flood:0.05:0:1, controls/lighting/pedestal-flood:0.05:0:1, controls/lighting/overhead-flood:0.05:0:1"
    # Canvas displays FlightGear draws at runtime (PFD, ND, EDP/SDP, FMA, MCDU): static meshes for now.
    hide_nodes "PFD1__pfd1_screen, PFD2__pfd2_screen, ND_L__ND_screenL, ND_R__ND_screenR, EDP-SDP__EDPSDP_Canvas, FMA1__fma1_screen, FMA2__fma2_screen, HT9100__mcdu1_screen"

# Captain's eye point: FlightGear view 0 (x -0.5 left, y 1.31 up, z -19.58 =
# 19.58 m forward of the model origin) in AC units of 0.1 m, plus the [model]
# offset (units x 2); FOV 78 in FlightGear, narrower here.
[camera]
    cockpit_position "5.0, 24.5, 195.8"
    cockpit_rotation_deg "-10, 0, 0"
    cockpit_fov      65.0
    orbit_distance     60.0
    orbit_distance_min 10.0
    orbit_distance_max 400.0

[gear]
    retractable     true
    retract_seconds 10.0
    # the FDM has no gear kinematic (FlightGear's gear.nas moved the legs): PVP drives gear/gear-pos-norm from the lever
    fdm_position    false
    steer_limited_deg 17.0
    steer_full_deg    82.0

[lights]
    # FlightGear's placements (MD-80-main.xml) in root units: the airframe file's -22.62 m offset applies, x aft / y up / z left.
    # Wing lights at the wing root (5.40 m), the nose light on the nose gear (-20.16 m).
    landing_pos          "5.40, -0.23, 16.17,  -20.16, -1.32, -0.14,  5.40, -0.23, -16.17"
    landing_props        "/systems/exterior-lights/left-landing-light, /systems/exterior-lights/nose-landing-light, /systems/exterior-lights/right-landing-light"
    landing_switch_props "controls/lighting/landing-light-l, controls/lighting/landing-light-n, controls/lighting/landing-light-r"
    landing_switch_on    1
    landing_switch_off   0
    landing_pitch_deg    4.0
    landing_range_m      400
    # cockpit floods: captain, first officer, pedestal, overhead (the INSTR PANEL LTS / pedestal / overhead FLOOD knobs)
    flood_pos            "-20.0, 1.45, 0.6,  -20.0, 1.45, -0.6,  -19.5, 1.25, 0.0,  -19.6, 1.75, 0.0"
    flood_props          "/controls/lighting/capt-flood, /controls/lighting/fo-flood, /controls/lighting/pedestal-flood, /controls/lighting/overhead-flood"
    flood_range_m        2.2
    flood_energy         0.1
    pair_meshes          false

[autoflight]
    # The DFGS mode logic (IT-AUTOFLIGHT, FlightGear Nasal/DFGS ported to C++:
    # ItAutoflight): HDG SEL / HOLD, VOR LOC, ILS, autoland, ALT HOLD / capture,
    # V/S, IAS / MACH, TURB, TOGA, autothrottle SPD / MACH / EPR LIM / CLAMP.
    it_autoflight true
    # acconfig options: arm the altitude a second after it was set (1 = on)
    auto_arm_alt 1

[flaps]
    # The MD-80 flap lever detents (controls/flight/flaps) as the FDM's lever table reads them:
    # UP/RET, UP/MID (slats), DIAL (the thumbwheel's 1-10 deg; slats only while the wheel is outside), 11, 15, 28, 40
    positions "0.0, 0.14, 0.25, 0.36, 0.58, 0.8, 0.91"
    names     "UP/RET, UP/MID, DIAL, 11, 15, 28, 40"
    # The DIAL detent exists only while the thumbwheel is set (1-10; stowed = -1 reads as UP/MID in the
    # lever table): stepping by key, button, lever click or drag skips it until the wheel is dialled.
    gated_detent   2
    gate_property  "/controls/flight/dial-a-flap"
    gate_min       1

[sound]
    fg_sounds  "sounds/sounds.json"
    # The cockpit wind sound reads /sim/sound/wind, which nothing in the package
    # writes; sound-control.xml computes the volume as /sim/sound/wind-v.
    aliases    "/sim/sound/wind = /sim/sound/wind-v"
    engine     "res://sounds/c172_engine_inflight.ogg"

[performance]
    # mean chord as the FDM's own inertia/cg-percent-mac uses it (23.06471 m, 3.06 m); % MAC stays live while the settings screen pauses the FDM
    mac_le_x_in     908.06
    mac_in          120.47
    vne_kts         340
    vno_kts         340
    vs_kts          110
    vs0_kts         100
    vr_kts          135
    vref_kts        130
