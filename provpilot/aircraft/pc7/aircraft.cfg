# ProvPilot aircraft definition — Pilatus PC-7
# --------------------------------------------
# See aircraft/c172p/aircraft.cfg for the full format documentation.
# Parsed by aircraft_config.gd (class AircraftConfig).

[aircraft]
    id          "pc7"
    name        "Pilatus PC-7 Turbo Trainer"
    description "Single-engine turboprop military trainer. PT6A, ~650 SHP."

[jsbsim]
    # The aircraft node (model origin, cameras) sits this many metres ahead of
    # the FDM's centre of gravity: with it the model's main wheels stand on the
    # FDM's main gear contacts, so the aircraft rotates about its wheels and
    # not through the runway. Measured with tests/probe_gear_align.tscn.
    origin_forward_m -1.15
    # JSBSim model name; data lives under <aircraft_dir>/jsbsim/{aircraft,engine,systems}.
    # The folder <aircraft_dir>/jsbsim/aircraft/pc7/pc7.xml must exist.
    model "pc7"

[model]
    # Canopy glass (AircraftRig::apply_glass_materials): the export's light grey at
    # 30 % with a rough surface looked milky; a dark tint at low alpha with a tight
    # highlight reads as clear perspex. Exact material names, or a prefix with *.
    glass_materials "transparent"
    glass_tint      0.3 0.36 0.42
    glass_alpha     0.14
    glass_roughness 0.06
    # 3D model file, relative to the aircraft directory.
    file        "model/pc7.glb"
    # res:// fallback used in exported builds / editor when no on-disk .glb exists.
    res_file    "res://aircraft/pc7/model/pc7.glb"
    # Scene-tree path (from node_3d root) to the loader node the model parents under.
    # Same loader node as the Cessna — the model is swapped at runtime.
    root_node   "AC/Node3D2/C172P_1"
    # Like the Cessna, this model's baked normals use the opposite handedness
    # from Godot's runtime lighting, so the sun lights the underside unless we
    # flip them once at load. Calibrated against the Cessna (whose body normals
    # measure the same orientation and require flip=true): every PC-7 exterior
    # mesh — fuselage skins, wings, AND the separated Aileron_L/Aileron_R —
    # measures the same way and must be flipped. Use an empty prefix so the flip
    # is applied UNIFORMLY to all meshes; a name prefix would miss the ailerons
    # (which are no longer "Object_*") and leave them lit from below.
    flip_normals        true
    flip_normals_prefix ""
    # Fitting transform: the Sketchfab mesh is yawed 90° right vs our nose-forward
    # convention, so rotate 90° left about the up (Y) axis. The mesh is in
    # metres (10.4 m span); the AC frame draws models at 0.2 m per unit, so
    # 5.0 puts it at real size (2026-09-27, it was drawn at 1/5). The mesh
    # origin sits at the fuselage vertical CENTER, so the model is lifted
    # (offset is applied after the scale, one unit = 0.2 m; calibrated with
    # tests/probe_gear_height.tscn: wheels on the ground at LSZH).
    rotation_deg "0, 90, 0"
    scale        5.0
    offset       "0, 9.55, 0"
    # FlightGear generic instruments built into the front panel and the KX 165 /
    # KR 87 radios on the right console (model/panel.xml, built from
    # model/pc7_source.glb by scripts/fg_panel_build.py --glb; docs/INSTRUMENTS.md §6).
    fg_animations "model/animations.json"

# Cockpit camera (Camera1) placement, in AC-node-local meters. Tune live: in the
# editor these values are read straight from this file on relaunch. Omit the
# whole section to keep the scene's default camera (as the Cessna does).
#   cockpit_position     "x, y, z"  — camera origin (x=right, y=up, z=back)
#   cockpit_rotation_deg "p, y, r"  — optional extra pitch/yaw/roll vs the default
#   cockpit_fov          degrees    — optional field of view
# The eye point of the 1/5 model, scaled x5 about the model origin with it.
[camera]
    cockpit_position "-0.104, 23.60, 11.95"
    # a little nose-down so both rows of the front panel are in view
    cockpit_rotation_deg "-8, 0, 0"
    cockpit_fov      55.0
    # external camera: metres from the aircraft (a 10 m aeroplane)
    orbit_distance     20.0
    orbit_distance_min 4.0
    orbit_distance_max 200.0

# Control-surface mesh nodes to animate. Paths are relative to model.root_node.
# The loader discards the GLB root and reparents its children under C172P_1, so
# paths start at "Sketchfab_model/...". The ailerons were separated and renamed
# in Blender, with their origins set on the hinge line.
[animation]
    left_aileron    "Sketchfab_model/pc7mki_obj_cleaner_materialmerger_gles/Aileron_L"
    right_aileron   "Sketchfab_model/pc7mki_obj_cleaner_materialmerger_gles/Aileron_R"
    rudder          "Sketchfab_model/pc7mki_obj_cleaner_materialmerger_gles/Rudder"
    # Single-piece tailplane (elevator/stabilator) — one mesh, not a L/R pair.
    single_elevator "Sketchfab_model/pc7mki_obj_cleaner_materialmerger_gles/Elevator"
    propeller       "Sketchfab_model/pc7mki_obj_cleaner_materialmerger_gles/Propeller"
    # Duplicate spinner cone (blades removed). Shown in place of the bladed
    # propeller above propeller.hide_blades_rpm so high RPM shows just the cone
    # plus the blur disc; only one of the two prop meshes is ever visible.
    propeller_cone  "Sketchfab_model/pc7mki_obj_cleaner_materialmerger_gles/Propeller_Cone_Only"
    # Four separated split flaps, each with its hinge-line origin set in Blender.
    # They rotate about control_limits.flap_hinge_axis by control_limits.flap_signs
    # (one sign per flap, in THIS order) × the commanded flap deflection.
    flaps           "Sketchfab_model/pc7mki_obj_cleaner_materialmerger_gles/Flaps_Left_Left, Sketchfab_model/pc7mki_obj_cleaner_materialmerger_gles/Flaps_Left_Center, Sketchfab_model/pc7mki_obj_cleaner_materialmerger_gles/Flaps_Right_Center, Sketchfab_model/pc7mki_obj_cleaner_materialmerger_gles/Flaps_Right_Right"

# No individually-named cockpit switches in this mesh.
[levers]

# Max visual deflection (degrees). Unused while [animation] is empty, but kept
# so values are available if an animatable model is supplied later.
[control_limits]
    rudder_max_deg      25.0
    # The PC-7 rudder is the vertical fin's trailing surface — it yaws about the
    # vertical (local Z) axis, not the Cessna's default Y. The "-" inverts the
    # sweep so it deflects the correct way for a given pedal input.
    rudder_hinge_axis   "-z"
    aileron_max_deg     20.0
    # The PC-7 ailerons were separated with their hinge (span) along local Y,
    # so they rotate about Y rather than the Cessna's default X.
    aileron_hinge_axis  "y"
    elevator_max_deg    25.0
    # The single-piece elevator's hinge (span) runs along local Y, like the
    # ailerons, so it pitches about Y rather than the Cessna's default X.
    elevator_hinge_axis "y"
    flap_max_deg        35.0
    # The split flaps were separated with their hinge (span) along local Y, like
    # the ailerons, so they rotate about Y. One sign per flap (matching the
    # [animation] flaps order: L-L, L-Center, R-Center, R-Right). Flip a sign if
    # a flap sweeps up instead of down. Tune live: edit, relaunch, set flaps.
    flap_hinge_axis     "y"
    flap_signs          "1, 1, 1, 1"
    front_wheel_max_deg 30.0

# Retractable landing gear. The G key toggles gear up/down; JSBSim drives drag +
# weight-on-wheels from gear-pos-norm.
#
# This airframe uses an IMPORTED Blender clip ("gear_cycle") for the visual
# retract/extend instead of procedural per-leg pivots. The clip is authored so
# its START is gear DOWN and its END is gear UP: frames 1-24 swing the legs up,
# frames 24-36 close the nose bay doors. _gear_retract_seconds sets how long the
# on-screen cycle takes (the clip is seeked across that span).
#
# Nose-wheel steering is still procedural and layered on top: the NoseWheel mesh
# is a CHILD of the clip-driven NoseWheel_Mechanic, so yawing it doesn't fight
# the retract animation. steer_pivot/axis are in the NoseWheel's local-parent
# frame and are STARTING GUESSES — tune live (edit, relaunch, press rudder).
[gear]
    retractable     true
    retract_seconds 3.0
    animation       "gear_cycle"
    legs            "nose, left, right"

    # Shared rolling-wheel radius (metres); wheels spin at ground_speed/radius
    # while on the ground (gear/wow) and freeze when airborne. roll_axis is the
    # local axle the wheel turns about — flip sign or change letter if a wheel
    # spins the wrong way or about the wrong axis.
    wheel_radius_m  0.30

    nose_wheel         "Sketchfab_model/pc7mki_obj_cleaner_materialmerger_gles/NoseWheel_Mechanic/NoseWheel"
    nose_roll          true
    nose_roll_axis     "-y"
    nose_steer         true
    nose_steer_axis    "-z"
    nose_steer_max_deg 30.0
    nose_steer_pivot   "0.0, 0.0, 0.0"

    left_wheel         "Sketchfab_model/pc7mki_obj_cleaner_materialmerger_gles/Wheel_Lleft_Mechanic/Wheel_Left"
    left_roll          true
    left_roll_axis     "y"

    right_wheel        "Sketchfab_model/pc7mki_obj_cleaner_materialmerger_gles/Wheel_Right_Mechanic/Wheel_Right"
    right_roll         true
    right_roll_axis    "-y"

# Flap detents. positions = JSBSim flap-cmd-norm values; names = HUD labels.
# PC-7 has UP / TAKEOFF / LAND settings.
[flaps]
    positions "0.0, 0.5, 1.0"
    names     "UP, T/O, LAND"

[propeller]
    max_rpm         2200.0
    blur_start_rpm  600.0
    hide_blades_rpm 900.0
    disc_radius_m   1.20
    # The PC-7 prop spins about the longitudinal (local X) axis; its node pivot
    # sits at a blade tip, so the disc is auto-centred on the mesh geometry.
    # Nudge it here (parent-space x,y,z metres) if it doesn't sit on the spinner.
    spin_axis       "x"
    disc_offset     "0.0, 0.0, -0.3"

[sound]
    # Placeholder: reuses the Cessna engine loop until a PC-7 sample is added.
    engine     "res://sounds/c172_engine_inflight.ogg"
    pitch_min  0.7
    pitch_max  1.6
    vol_db_min -12.0
    vol_db_max 3.0

# Reference figures (public data for the Pilatus PC-7; not tuned to the FDM),
# shown in Settings > Aircraft.
[performance]
    vne_kts         270
    vno_kts         220
    vs_kts          64
    vs0_kts         60
    vr_kts          80
    vref_kts        85
    ceiling_ft      33000
    max_takeoff_lbs 5952
    empty_lbs       3704
    notes "Gear and flap limit speeds 150 kt."
